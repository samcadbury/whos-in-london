name: Update events and publish site

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC (6am in London during summer time)
  push:
    branches: [main]
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch London events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          OUT_DIR: _site
          FALLBACK_URL: ${{ steps.pages.outputs.base_url }}/events.json
        run: node scripts/fetch-events.mjs

      - name: Copy the app
        run: cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
